# Online hosting: the app + MySQL + automatic HTTPS (Caddy). Run from this folder:  docker compose up -d --build
services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: inventory_db
      TZ: Africa/Lagos
    volumes:
      - dbdata:/var/lib/mysql          # your data lives here and survives restarts and updates
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
    # No "ports:" on purpose: the database is NOT reachable from the internet.

  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://db:3306/inventory_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Africa/Lagos
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD}
      INVENTORY_ADMIN_USERNAME: ${INVENTORY_ADMIN_USERNAME:-admin}
      INVENTORY_ADMIN_PASSWORD: ${INVENTORY_ADMIN_PASSWORD}
      COOKIE_SECURE: "true"
      TZ: Africa/Lagos
    # No "ports:" either: only Caddy (HTTPS) can reach the app.

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data               # HTTPS certificates
      - caddy_config:/config

volumes:
  dbdata:
  caddy_data:
  caddy_config:
