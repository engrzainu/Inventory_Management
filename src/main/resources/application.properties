spring.application.name=inventory-management
server.port=8080

# Database. Override with environment variables DB_URL / DB_USERNAME / DB_PASSWORD.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/inventory_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Africa/Lagos}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:CHANGE_ME}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

server.error.include-message=always

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# First Inventory Admin, created only when the database has no users. Set INVENTORY_ADMIN_PASSWORD.
# If empty, a random password is generated and printed in the console log.
# Forgot the admin password? Set INVENTORY_RESET_ADMIN_PASSWORD=true together with INVENTORY_ADMIN_PASSWORD for one start.
app.security.admin-username=${INVENTORY_ADMIN_USERNAME:admin}
app.security.admin-password=${INVENTORY_ADMIN_PASSWORD:}
app.security.reset-admin-password=${INVENTORY_RESET_ADMIN_PASSWORD:false}

# Set to true to load 5 sample products into an empty database (demo only).
app.seed-demo-data=${INVENTORY_SEED_DEMO:false}

# ---- Running online (behind HTTPS) ----
# Trust X-Forwarded-* headers from a reverse proxy on a private network (Caddy/Nginx/Docker).
server.forward-headers-strategy=native
# Sign out idle users after 8 hours.
server.servlet.session.timeout=8h
# Set COOKIE_SECURE=true when the site is served over HTTPS so cookies never travel over plain HTTP.
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.http-only=true
