<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sign in | InventoryPro</title><link rel="stylesheet" href="/css/style.css"></head>
<body class="login-page"><form id="loginForm" class="login-card">
<div class="brand-mark">▣</div><h1>InventoryPro</h1><p>Sign in to manage your shop</p>
<label>Username<input name="username" required autocomplete="username"></label>
<label>Password<input name="password" type="password" required autocomplete="current-password"></label>
<button class="btn primary full" type="submit">Sign in</button><div id="loginError" class="error"></div>
</form>
<script>
document.getElementById('loginForm').addEventListener('submit', async e => {
 e.preventDefault(); const form = new URLSearchParams(new FormData(e.target));
 const r = await fetch('/login',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded','X-XSRF-TOKEN':(document.cookie.match(/(?:^|; )XSRF-TOKEN=([^;]*)/)||[])[1]||''},body:form,credentials:'same-origin'});
 if(r.ok) location.href='/'; else { let m='Login failed. Check your username and password.'; try{ m=(await r.json()).error||m }catch{} document.getElementById('loginError').textContent=m; }
});
</script></body></html>
